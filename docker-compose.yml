services:
  unstuckinator-backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8060:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./unstuck.db}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET before starting}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-1440}
    networks:
      - dokploy-network

  unstuckinator-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3060:3000"
    depends_on:
      - unstuckinator-backend
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
